name: Dependabot auto-approve
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event.action != 'closed'
    steps:
      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Approve patch and minor updates
        if: ${{steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' || steps.dependabot-metadata.outputs.update-type == 'version-update:semver-minor'}}
        run: gh pr review $PR_URL --approve -b "I'm **approving** this pull request because **it includes a patch or minor update**"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Approve major updates of development dependencies
        if: ${{steps.dependabot-metadata.outputs.update-type == 'version-update:semver-major' && steps.dependabot-metadata.outputs.dependency-type == 'direct:development'}}
        run: gh pr review $PR_URL --approve -b "I'm **approving** this pull request because **it includes a major update of a dependency used only in development**"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Approve GitHub Actions updates
        if: ${{steps.dependabot-metadata.outputs.package-ecosystem == 'github_actions'}}
        run: gh pr review $PR_URL --approve -b "I'm **approving** this pull request because **it includes a GitHub Actions update**"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Approve indirect dependency updates
        if: ${{steps.dependabot-metadata.outputs.dependency-type == 'indirect'}}
        run: gh pr review $PR_URL --approve -b "I'm **approving** this pull request because **it includes an indirect dependency update**"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Approve grouped dependency updates
        if: ${{steps.dependabot-metadata.outputs.dependency-group != '' && steps.dependabot-metadata.outputs.dependency-type != 'direct:production'}}
        run: gh pr review $PR_URL --approve -b "I'm **approving** this pull request because **it includes a grouped dependency update**"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Comment on major updates of non-development dependencies
        if: ${{steps.dependabot-metadata.outputs.update-type == 'version-update:semver-major' && steps.dependabot-metadata.outputs.dependency-type == 'direct:production' && steps.dependabot-metadata.outputs.package-ecosystem != 'github_actions'}}
        run: |
          gh pr comment $PR_URL --body "I'm **not approving** this PR because **it includes a major update of a dependency used in production**"
          gh pr edit $PR_URL --add-label "requires-manual-qa"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  trigger-deploy:
    runs-on: ubuntu-latest
    # Merges performed via the default GITHUB_TOKEN (which is how auto-merge
    # above works) don't fire a new push event - GitHub suppresses that to
    # prevent infinite automation loops. workflow_dispatch is exempted from
    # that restriction, so we use it to explicitly kick off the real deploy
    # once a Terraform PR actually merges (not just closed-without-merging).
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'terraform')
    permissions:
      actions: write
    steps:
      - name: Trigger Terraform
        run: gh workflow run "Deploy Infrastructure" --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
